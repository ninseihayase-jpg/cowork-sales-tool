services:
  # ── Webアプリ（営業支援ツール本体） ──────────────────────────────────
  - type: web
    name: sfa-crm
    env: python
    region: singapore
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/run_webapp.py
    envVars:
      - key: PORT
        value: 8080
      - key: SFA_DB_PATH
        value: /data/cowork_sfa.db
      - key: COWORK_SFA_DB
        value: /data/cowork_sfa.db
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: THEME_API_TOKEN
        sync: false          # 秘密情報。Renderダッシュボードで設定（平文コミット禁止）
      - key: THEME_API_URL
        value: https://hisho-ohxe.onrender.com
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: SFA_TOOL_URL
        value: https://sfa-crm.onrender.com
      - key: SFA_API_TOKEN
        sync: false
      - key: SFA_BASIC_USER
        sync: false          # ブラウザ向けBasic認証ユーザー名。未設定だと全ページ503
      - key: SFA_BASIC_PASS
        sync: false          # ブラウザ向けBasic認証パスワード
      - key: SLACK_DESK_BOT_TOKEN
        sync: false          # 事務Bot(Ope Bot)のトークン。@事務Botメンション起票・完了通知の投稿に使用
      - key: SLACK_DESK_SIGNING_SECRET
        sync: false          # 事務Botの署名シークレット（/slack/desk-events 検証）
      - key: SLACK_OPS_CHANNEL_ID
        sync: false          # #オペレータ全体チャネルID。事務タスク完了通知で起票元スレッドが無い時の投稿先
    disk:
      name: sfa-db
      mountPath: /data
      sizeGB: 1

  # ── 週次商談確認通知（機能5）── 水曜 17:30 JST ───────────────────────
  - type: cron
    name: sfa-weekly-notify
    env: python
    region: singapore
    schedule: "30 8 * * 3"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/weekly_slack_notify.py
    envVars:
      - key: SFA_DB_PATH
        value: /data/cowork_sfa.db
      - key: COWORK_SFA_DB
        value: /data/cowork_sfa.db
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: WEEKLY_SHEET_ID
        sync: false
      - key: SFA_TOOL_URL
        sync: false
      - key: SFA_API_TOKEN
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false

  # ── 翌日アポSlack自動スレ立て（日次 06:00 JST）────────────────────────
  - type: cron
    name: sfa-daily-appt-notify
    env: python
    region: singapore
    schedule: "0 21 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/daily_appt_slack_notify.py
    envVars:
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SALES_CHANNEL_ID
        value: C0AT55W40ET
      - key: SFA_TOOL_URL
        value: https://sfa-crm.onrender.com
      - key: SFA_API_TOKEN
        sync: false

  # ── 繰り返し事務タスクの複製（日次 07:00 JST）────────────────────────
  # 「繰り返し発生」テンプレの複製タイミングを判定し、期間分のカードを複製する（冪等）。
  # ディスク（/data）はwebサービス専属のため、cronは /api/tasks/duplicate_recurring 経由で実行。
  - type: cron
    name: sfa-daily-recur-dup
    env: python
    region: singapore
    schedule: "0 22 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/duplicate_recurring_tasks.py
    envVars:
      - key: SFA_TOOL_URL
        value: https://sfa-crm.onrender.com
      - key: SFA_API_TOKEN
        sync: false

  # ── 請求タスクSlackリマインド（日次 08:00 JST）────────────────────────
  # 種類=経費・請求の未完了事務タスクを、期限前日〜期限超過の間、担当者へDMでリマインド。
  - type: cron
    name: sfa-daily-billing-reminder
    env: python
    region: singapore
    schedule: "0 23 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/billing_task_slack_reminder.py
    envVars:
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SFA_TOOL_URL
        value: https://sfa-crm.onrender.com
      - key: SFA_API_TOKEN
        sync: false

  # ── 商談スプシエクスポート（日次 09:00 JST） ────────────────────────
  - type: cron
    name: sfa-daily-export
    env: python
    region: singapore
    schedule: "0 0 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/export_deals_to_sheets.py
    envVars:
      - key: SFA_API_URL
        value: https://sfa-crm.onrender.com
      - key: SFA_API_TOKEN
        sync: false
      - key: WEEKLY_SHEET_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
