services:
  # ── Webアプリ（営業支援ツール本体） ──────────────────────────────────
  - type: web
    name: sfa-crm
    env: python
    region: singapore
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/run_webapp.py
    envVars:
      - key: PORT
        value: 8080
      - key: SFA_DB_PATH
        value: /data/cowork_sfa.db
      - key: COWORK_SFA_DB
        value: /data/cowork_sfa.db
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: THEME_API_TOKEN
        sync: false          # 秘密情報。Renderダッシュボードで設定（平文コミット禁止）
      - key: THEME_API_URL
        value: https://hisho-ohxe.onrender.com
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: SFA_TOOL_URL
        value: https://sfa-crm.onrender.com
      - key: SFA_API_TOKEN
        sync: false
      - key: SFA_BASIC_USER
        sync: false          # ブラウザ向けBasic認証ユーザー名。未設定だと全ページ503
      - key: SFA_BASIC_PASS
        sync: false          # ブラウザ向けBasic認証パスワード
      - key: SLACK_DESK_BOT_TOKEN
        sync: false          # 事務Bot(Ope Bot)のトークン。@事務Botメンション起票・完了通知の投稿に使用
      - key: SLACK_DESK_SIGNING_SECRET
        sync: false          # 事務Botの署名シークレット（/slack/desk-events 検証）
      - key: SLACK_TASK_BOT_TOKEN
        sync: false          # #93 通常タスクBot専用トークン。🎯リアクション・@メンション起票の投稿に使用
      - key: SLACK_TASK_SIGNING_SECRET
        sync: false          # #93 通常タスクBotの署名シークレット（/slack/task-events 検証）
      - key: SLACK_OPS_CHANNEL_ID
        sync: false          # #オペレータ全体チャネルID。事務タスク完了通知で起票元スレッドが無い時の投稿先
      - key: JAMIE_WEBHOOK_SECRET
        sync: false          # Jamie webhook署名検証シークレット(#29 P3)。署名(HMAC)方式を使う場合に設定
      - key: JAMIE_WEBHOOK_API_KEY
        sync: false          # Jamie webhook APIキーヘッダ方式(#29 P3)。x-jamie-api-key と照合。どちらか片方でも可
      - key: SALES_CHANNEL_ID
        sync: false          # #sales チャンネルID。Jamie文字起こし到着時の商談候補提示の投稿先(#98)
      # 「今日明日のタスク」画面へのGoogleカレンダー重ね表示(#101マイルストン2、2026-08-31)。
      # 3つとも未設定なら丸ごとスキップ・fail-open（タスク配置画面自体には影響なし）。
      # 当初はサービスアカウントへのカレンダー共有方式を試したが、Workspace管理コンソールの
      # 外部共有制限で「予定の表示（時間枠のみ）」までしか許可されず断念。早瀬本人のOAuth
      # リフレッシュトークン方式（Hisho側google_calendar.pyと同じ仕組み）に切替え。
      # GCPでOAuthクライアントID（種類=デスクトップアプリ、同意画面のユーザータイプ=内部）を
      # 作成し、スコープcalendar.readonlyで本人が初回だけブラウザ認可→発行されたリフレッシュ
      # トークンを設定する。ドメイン全体の委任(#64のP2)もカレンダー共有も不要。
      - key: HAYASE_GOOGLE_CLIENT_ID
        sync: false
      - key: HAYASE_GOOGLE_CLIENT_SECRET
        sync: false
      - key: HAYASE_GOOGLE_REFRESH_TOKEN
        sync: false
    disk:
      name: sfa-db
      mountPath: /data
      sizeGB: 1

  # ── 週次商談確認通知（機能5）は2026-08-27にユーザー要望で停止。
  # Renderダッシュボード側のCron Job "sfa-weekly-notify" は手動作成運用（Blueprint非同期）
  # のため、この記述を消すだけでは止まらない。ユーザーがRenderダッシュボードで
  # "sfa-weekly-notify" を一時停止/削除する必要あり（scripts/weekly_slack_notify.py 自体は
  # コードとして残す。再開時はこのブロックをrender.yaml履歴から復元して手動再作成すればよい）。

  # ── 翌日アポSlack自動スレ立て（日次 06:00 JST）────────────────────────
  - type: cron
    name: sfa-daily-appt-notify
    env: python
    region: singapore
    schedule: "0 21 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/daily_appt_slack_notify.py
    envVars:
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SALES_CHANNEL_ID
        value: C0AT55W40ET
      - key: SFA_TOOL_URL
        value: https://sfa-crm.onrender.com
      - key: SFA_API_TOKEN
        sync: false
      # #64 カレンダー突合（GOOGLE_CALENDAR_SA_JSON未設定の間は丸ごとスキップ・fail-open）
      - key: GOOGLE_CALENDAR_SA_JSON
        sync: false          # ドメイン全体委任サービスアカウントの鍵JSON。セットアップ手順:
                              # docs/calendar-crosscheck/02_Googleカレンダー委任セットアップ手順.md
      - key: GOOGLE_WORKSPACE_DOMAIN
        value: inproc.org
      - key: CALENDAR_CROSSCHECK_NOTIFY_MODE
        value: dm            # "dm"（早瀬個人へDM）｜ "channel" に変えるとSALES_CHANNEL_IDへ投稿
      - key: CALENDAR_CROSSCHECK_OWNERS
        value: "吉江,中島,岩崎,早瀬,高橋,土屋"   # 顧客面談に参加するメンバーのみ（2026-08-17確定）
      - key: CALENDAR_CROSSCHECK_MODE
        value: shadow        # P2完了後もまずshadowのまま精度確認。確認後liveへ切替（§5.4）

  # ── 繰り返し事務タスクの複製（日次 07:00 JST）────────────────────────
  # 「繰り返し発生」テンプレの複製タイミングを判定し、期間分のカードを複製する（冪等）。
  # ディスク（/data）はwebサービス専属のため、cronは /api/tasks/duplicate_recurring 経由で実行。
  - type: cron
    name: sfa-daily-recur-dup
    env: python
    region: singapore
    schedule: "0 22 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/duplicate_recurring_tasks.py
    envVars:
      - key: SFA_TOOL_URL
        value: https://sfa-crm.onrender.com
      - key: SFA_API_TOKEN
        sync: false

  # ── 請求タスクSlackリマインド（日次 08:00 JST）────────────────────────
  # 種類=経費・請求の未完了事務タスクを、期限前日〜期限超過の間、担当者へDMでリマインド。
  - type: cron
    name: sfa-daily-billing-reminder
    env: python
    region: singapore
    schedule: "0 23 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/billing_task_slack_reminder.py
    envVars:
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SFA_TOOL_URL
        value: https://sfa-crm.onrender.com
      - key: SFA_API_TOKEN
        sync: false

  # ── 取り込みインボックス見逃し検知リマインド（日次 09:15 JST）───────────
  # 前日以前から残っている未処理の取り込み（未割当 or 割当済みだがSlack未確定でJamie
  # 全文が未統合）を検知して通知する(#98)。当面は早瀬個人へDM固定。運用を見て
  # INTAKE_STALE_NOTIFY_MODE=channel に切替（#salesへ変更）を検討する。
  - type: cron
    name: sfa-daily-intake-stale-reminder
    env: python
    region: singapore
    schedule: "15 0 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/intake_inbox_stale_slack_reminder.py
    envVars:
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SFA_TOOL_URL
        value: https://sfa-crm.onrender.com
      - key: SFA_API_TOKEN
        sync: false
      - key: INTAKE_STALE_NOTIFY_MODE
        value: dm            # "dm"（早瀬個人へDM）｜ "channel" に変えるとSALES_CHANNEL_IDへ投稿

  # ── Slack NegoCollection放置検知リマインド（営業時間中2時間おき: JST 9/11/13/15/17/19時）──
  # #salesスレッドで@NegoCollectionの下書きに対し「確定」/「ok」されずに放置されているスレッドへ、
  # そのスレッド自体に直接「まだ保存されていません」とアナウンスする。無反応（無言）で
  # 完了と誤解される事故の防止。1回送ったら状態が変わるまで再送しない。
  - type: cron
    name: sfa-nego-thread-stale-reminder
    env: python
    region: singapore
    schedule: "0 0-10/2 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/nego_thread_reminder.py
    envVars:
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SFA_TOOL_URL
        value: https://sfa-crm.onrender.com
      - key: SFA_API_TOKEN
        sync: false
      - key: HOURS
        value: "3"

  # ── 商談スプシエクスポート（日次 09:00 JST） ────────────────────────
  - type: cron
    name: sfa-daily-export
    env: python
    region: singapore
    schedule: "0 0 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/export_deals_to_sheets.py
    envVars:
      - key: SFA_API_URL
        value: https://sfa-crm.onrender.com
      - key: SFA_API_TOKEN
        sync: false
      - key: WEEKLY_SHEET_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
